<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1c3f" />
      <stop offset="1" stop-color="#0b3d91" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26b0a3" />
      <stop offset="1" stop-color="#39ff88" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative blobs -->
  <circle cx="1050" cy="150" r="220" fill="#26b0a3" opacity="0.08" />
  <circle cx="150" cy="550" r="200" fill="#a78bfa" opacity="0.08" />

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <rect width="80" height="80" rx="20" fill="url(#accent)" />
    <path d="M22 58 L22 22 L58 58 L58 22" stroke="#08131f" stroke-width="6"
      stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="58" cy="22" r="5" fill="#08131f" />
    <circle cx="58" cy="22" r="2.5" fill="#26b0a3" />
  </g>

  <!-- Brand name -->
  <text x="80" y="230" font-family="Inter, system-ui, sans-serif"
    font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Stinger<tspan fill="#26b0a3">FX</tspan>
  </text>

  <!-- Headline -->
  <text x="80" y="360" font-family="Inter, system-ui, sans-serif"
    font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">
    Trade smarter.
  </text>
  <text x="80" y="440" font-family="Inter, system-ui, sans-serif"
    font-size="72" font-weight="800" fill="url(#accent)" letter-spacing="-2">
    Bot faster.
  </text>

  <!-- Subtitle -->
  <text x="80" y="520" font-family="Inter, system-ui, sans-serif"
    font-size="24" fill="#a0b4d8">
    Live analysis · Visual bot builder · Real-time charts
  </text>

  <!-- Footer tag -->
  <text x="80" y="580" font-family="Inter, system-ui, sans-serif"
    font-size="18" fill="#5a7096" font-weight="600">
    stingerfx.site
  </text>

  <!-- Right side: mini chart decoration -->
  <g transform="translate(760, 200)" opacity="0.9">
    <rect x="0" y="120" width="24" height="100" fill="#26b0a3" rx="3" />
    <rect x="40" y="90" width="24" height="130" fill="#ef4444" rx="3" />
    <rect x="80" y="60" width="24" height="160" fill="#26b0a3" rx="3" />
    <rect x="120" y="100" width="24" height="120" fill="#ef4444" rx="3" />
    <rect x="160" y="40" width="24" height="180" fill="#26b0a3" rx="3" />
    <rect x="200" y="70" width="24" height="150" fill="#26b0a3" rx="3" />
    <rect x="240" y="30" width="24" height="190" fill="#26b0a3" rx="3" />
    <rect x="280" y="90" width="24" height="130" fill="#ef4444" rx="3" />
    <rect x="320" y="10" width="24" height="210" fill="#26b0a3" rx="3" />
    <line x1="0" y1="220" x2="344" y2="220" stroke="#2b4574" stroke-width="2" />
  </g>
</svg>